services:
  homarr:
    image: ${HOMARR_IMAGE}
    container_name: homarr
    environment:
      - PORT=7575
    ports:
      - "${HOMARR_PORT}:7575"
    volumes:
      - ./homarr/configs:/app/data/configs
      - ./homarr/icons:/app/public/icons
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$$(hostname):7575 || exit 1"]
    restart: unless-stopped

  portainer:
    image: ${PORTAINER_IMAGE}
    container_name: portainer
    ports:
      - "${PORTAINER_PORT}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data
    restart: unless-stopped

  jellyfin:
    image: ${JELLYFIN_IMAGE}
    container_name: jellyfin
    ports:
      - "${JELLYFIN_PORT}:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - type: bind
        source: /mnt/WD_Blue
        target: /mnt/WD_Blue
        bind:
          propagation: rslave
      - type: bind
        source: /mnt/WD_Externo
        target: /mnt/WD_Externo
        bind:
          propagation: rslave
      - type: bind
        source: /mnt/Samsung
        target: /mnt/Samsung
        bind:
          propagation: rslave
    restart: unless-stopped

  filebrowser:
    image: ${FILEBROWSER_IMAGE}
    container_name: filebrowser
    ports:
      - "${FILEBROWSER_PORT}:80"
    volumes:
      - ./filebrowser/root:/srv
      - type: bind
        source: /mnt/WD_Blue
        target: /srv/WD_Blue
        bind:
          propagation: rslave
      - type: bind
        source: /mnt/WD_Externo
        target: /srv/WD_Externo
        bind:
          propagation: rslave
      - type: bind
        source: /mnt/Samsung
        target: /srv/Samsung
        bind:
          propagation: rslave
      - ./filebrowser/database:/database
    command:
      - --database
      - /database/filebrowser.db
      - --root
      - /srv
      - --address
      - 0.0.0.0
      - --port
      - "80"
    restart: unless-stopped

  qbittorrent:
    image: ${QBITTORRENT_IMAGE}
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    volumes:
      - ./qbittorrent/config:/config
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
        bind:
          propagation: rslave
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
      - "${QBITTORRENT_TCP_PORT}:6881"
      - "${QBITTORRENT_UDP_PORT}:6881/udp"
    restart: unless-stopped

  librespeed:
    image: ${LIBRESPEED_IMAGE}
    container_name: librespeed
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./librespeed/config:/config
    ports:
      - "${LIBRESPEED_PORT}:80"
    restart: unless-stopped

  uptime-kuma:
    image: ${UPTIME_KUMA_IMAGE}
    container_name: uptime-kuma
    ports:
      - "${UPTIME_KUMA_PORT}:3001"
    volumes:
      - ./uptime-kuma/data:/app/data
    restart: unless-stopped

  netdata:
    image: ${NETDATA_IMAGE}
    container_name: netdata
    environment:
      - NETDATA_CLAIM_URL=https://app.netdata.cloud
      - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN:-}
      - NETDATA_CLAIM_ROOMS=${NETDATA_CLAIM_ROOMS:-}
    ports:
      - "${NETDATA_PORT}:19999"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./netdata/config:/etc/netdata
      - ./netdata/lib:/var/lib/netdata
      - ./netdata/cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  n8n:
    image: ${N8N_IMAGE}
    container_name: n8n
    environment:
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
    ports:
      - "${N8N_PORT}:5678"
    volumes:
      - ./n8n/data:/home/node/.n8n
    restart: unless-stopped

  radarr:
    image: ${RADARR_IMAGE}
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./radarr/config:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "${RADARR_PORT}:7878"
    restart: unless-stopped

  prowlarr:
    image: ${PROWLARR_IMAGE}
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./prowlarr/config:/config
    ports:
      - "${PROWLARR_PORT}:9696"
    restart: unless-stopped

  swingmusic:
    image: ${SWINGMUSIC_IMAGE}
    container_name: swingmusic
    environment:
      - SWINGMUSIC_PORT=1970
      - SWINGMUSIC_DEVICE_NAME=${SWINGMUSIC_DEVICE_NAME}
    volumes:
      - type: bind
        source: ${MEDIA_ROOT}
        target: /music
        bind:
          propagation: rslave
      - ./swingmusic/config:/config
    ports:
      - "${SWINGMUSIC_PORT}:1970"
    restart: unless-stopped

  nextcloud-db:
    image: ${NEXTCLOUD_DB_IMAGE}
    container_name: nextcloud-db
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${NEXTCLOUD_DB_NAME}
      - MYSQL_USER=${NEXTCLOUD_DB_USER}
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - TZ=${TZ}
    volumes:
      - ./nextcloud/db:/var/lib/mysql
    restart: unless-stopped

  nextcloud-redis:
    image: ${NEXTCLOUD_REDIS_IMAGE}
    container_name: nextcloud-redis
    restart: unless-stopped

  nextcloud:
    image: ${NEXTCLOUD_IMAGE}
    container_name: nextcloud
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=${NEXTCLOUD_DB_NAME}
      - MYSQL_USER=${NEXTCLOUD_DB_USER}
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
      - PHP_MEMORY_LIMIT=${NEXTCLOUD_PHP_MEMORY_LIMIT}
      - PHP_UPLOAD_LIMIT=${NEXTCLOUD_PHP_UPLOAD_LIMIT}
      - TZ=${TZ}
    ports:
      - "${NEXTCLOUD_PORT}:80"
    volumes:
      - ./nextcloud/html:/var/www/html
      - type: bind
        source: ${NEXTCLOUD_DATA_ROOT}
        target: /var/www/html/data
        bind:
          propagation: rslave
      - type: bind
        source: /mnt/WD_Blue
        target: /external/disks/WD_Blue
        bind:
          propagation: rslave
      - type: bind
        source: /mnt/WD_Externo
        target: /external/disks/WD_Externo
        bind:
          propagation: rslave
      - type: bind
        source: /mnt/Samsung
        target: /external/disks/Samsung
        bind:
          propagation: rslave
    restart: unless-stopped

  nextcloud-cron:
    image: ${NEXTCLOUD_IMAGE}
    container_name: nextcloud-cron
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    entrypoint: /cron.sh
    volumes:
      - ./nextcloud/html:/var/www/html
      - type: bind
        source: ${NEXTCLOUD_DATA_ROOT}
        target: /var/www/html/data
        bind:
          propagation: rslave
      - type: bind
        source: /mnt/WD_Blue
        target: /external/disks/WD_Blue
        bind:
          propagation: rslave
      - type: bind
        source: /mnt/WD_Externo
        target: /external/disks/WD_Externo
        bind:
          propagation: rslave
      - type: bind
        source: /mnt/Samsung
        target: /external/disks/Samsung
        bind:
          propagation: rslave
    restart: unless-stopped
